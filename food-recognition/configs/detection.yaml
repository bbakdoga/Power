# Food detector: finds every separate food region. It is class-agnostic
# ("food" vs background) on purpose: the classifier names each crop, so adding
# a food later only means retraining the small classifier.
seed: 1337
assets: [yolox_code, owned_photos]   # every asset used must be `approved` in licenses/assets.yaml

model:
  architecture: yolox_tiny        # ~5M params, ~10 MB float16
  num_classes: 1                  # food
  input_size: [416, 416]
  pretrained: null                # asset id, e.g. openimages_pretrain_own once approved

train:
  epochs: 150
  batch_size: 64
  lr: 0.01
  weight_decay: 0.0005
  warmup_epochs: 5
  mixed_precision: true
  augment:
    mosaic: 0.5
    hsv: true
    flip_lr: 0.5
    scale: [0.5, 1.5]
    low_light: 0.2                # simulate poor lighting

postprocess:
  confidence_threshold: 0.30
  nms_iou_threshold: 0.50
  max_detections: 20
  min_box_side: 16                # px at input resolution

evaluation:
  iou_thresholds: [0.50, 0.55, 0.60, 0.65, 0.70, 0.75, 0.80, 0.85, 0.90, 0.95]

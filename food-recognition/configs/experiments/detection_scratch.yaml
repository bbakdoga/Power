# Experiment: random initialisation, no pretrained weights.
# Same dataset version, same test split and same evaluation as the Open Images run,
# so the two can be compared fairly. From-scratch models need longer schedules and
# stronger augmentation, so this config trains longer.
seed: 1337
assets:
- yolox_code
- owned_photos
model:
  architecture: yolox_tiny
  num_classes: 1
  input_size:
  - 416
  - 416
  pretrained: null
train:
  epochs: 300
  batch_size: 64
  lr: 0.01
  weight_decay: 0.0005
  warmup_epochs: 5
  mixed_precision: true
  augment:
    mosaic: 0.5
    hsv: true
    flip_lr: 0.5
    scale:
    - 0.5
    - 1.5
    low_light: 0.2
postprocess:
  confidence_threshold: 0.3
  nms_iou_threshold: 0.5
  max_detections: 20
  min_box_side: 16
evaluation:
  iou_thresholds:
  - 0.5
  - 0.55
  - 0.6
  - 0.65
  - 0.7
  - 0.75
  - 0.8
  - 0.85
  - 0.9
  - 0.95
experiment:
  name: detection-scratch
  init: scratch
  compare_with: detection-openimages

# Food taxonomy v0.1.0
#
# 45 foods chosen for a fitness app: common meals that people log often and
# that look different enough from each other to tell apart in a photo.
#
# Rules
# - `id` values are permanent. Never reuse or renumber an id; retire a class with
#   `retired: true` instead, so old annotations and models stay readable.
# - `name` is the machine label (snake_case) stored in annotations and models.
# - `fdc_query` is only a search hint the app uses to look up USDA FoodData
#   Central AFTER the user confirms the food. The recognition models never
#   output calories or nutrients.
# - `open_images_candidate` names an Open Images V7 class that might be a useful
#   source of extra training images. Each one must be checked against the
#   official class list, and the images' licences checked, before use.
# - id 0 `unknown_food` is reserved: annotators use it for food that is not in
#   the taxonomy or that they cannot identify. The detector still learns it as
#   food; the classifier never predicts it as a positive class.

version: "0.1.0"
unknown:
  id: 0
  name: unknown_food
  display_name: Unknown food

classes:
  # Protein
  - {id: 1,  name: grilled_chicken,  display_name: Grilled chicken,  group: protein,   fdc_query: "chicken breast grilled",       open_images_candidate: null}

name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Build (Xcode ${{ matrix.xcode }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # GitHub's runners no longer include Xcode 15, and Xcode 16.0 has no
          # matching simulator runtime there, so CI builds on 16.4 only. The
          # iOS 17.0 deployment target still makes the compiler reject any
          # iOS 18-only API, which is what would break Xcode 15.4 users.
          - runner: macos-15
            xcode: "16.4"
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode ${{ matrix.xcode }}
        run: sudo xcode-select -s /Applications/Xcode_${{ matrix.xcode }}.app
      - name: Show Xcode version
        run: xcodebuild -version
      - name: Build for the iOS Simulator
        run: |
          xcodebuild build \
            -project Power.xcodeproj \
            -target Power \
            -sdk iphonesimulator \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO

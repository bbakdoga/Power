name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Build (Xcode ${{ matrix.xcode }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            xcode: "15.4"
          - runner: macos-15
            xcode: "16.4"
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode ${{ matrix.xcode }}
        run: |
          ls -d /Applications/Xcode*.app
          sudo xcode-select -s /Applications/Xcode_${{ matrix.xcode }}.app
      - name: Show Xcode version
        run: xcodebuild -version
      - name: Build for the iOS Simulator
        run: |
          xcodebuild build \
            -project Power.xcodeproj \
            -target Power \
            -sdk iphonesimulator \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO

name: Food recognition

on:
  push:
    branches: [main]
    paths: ["food-recognition/**", ".github/workflows/food-recognition.yml"]
  pull_request:
    paths: ["food-recognition/**", ".github/workflows/food-recognition.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: food-recognition
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - run: ruff check src tests
      - run: mypy src
      - run: pytest
      - run: food-rec check-licenses
      - run: food-rec check-taxonomy
